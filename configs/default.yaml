# Configurazione di riferimento.
# L'area coincide con quella dei dati gia esplorati in EDA.ipynb: 261 x 401 punti a 0.25 gradi.

region:
  name: euro_atlantic
  north: 75.0
  west: -40.0
  south: 10.0
  east: 60.0
  # Risoluzione richiesta al CDS (regridding lato server). null = griglia nativa 0.25.
  grid: 0.25

time:
  # Estremi inclusivi, formato YYYY-MM-DD. Il primo e l'ultimo mese possono essere
  # parziali. `end` non e scelto a mano: e la data restituita da end_datetime nei
  # metadati della collection CDS, verificata da scripts/check_cds_access.py.
  # ERA5 ha ~6 giorni di latenza, quindi non arriva a oggi.
  start: "2024-01-01"
  end: "2026-08-11"
  # Slot giornalieri previsti: mattina / mezzogiorno / sera (UTC).
  slot_hours: [6, 12, 18]
  # Finestra di aggregazione per le variabili cumulate, in ore, centrata sullo slot.
  accum_window_hours: 8

variables:
  # Campi istantanei: scaricati solo agli slot_hours.
  instantaneous:
    - 2m_temperature
    - 2m_dewpoint_temperature
    - mean_sea_level_pressure
    - 10m_u_component_of_wind
    - 10m_v_component_of_wind
    - total_cloud_cover
    # Stato del manto nevoso: memoria fisica che condiziona la temperatura
    # (albedo, fusione) e la persistenza della neve. Predittore, non target.
    - snow_depth
  # Campi cumulati sull'ora precedente: richiedono cadenza oraria per essere aggregati.
  accumulated:
    - total_precipitation
    - snowfall
  # Campi su livelli di pressione (collection reanalysis-era5-pressure-levels).
  # Campionati agli slot_hours come gli istantanei di superficie, un file per livello.
  # Vuoto per default: abilitarli cambia il numero di canali di input e rende
  # inutilizzabili i checkpoint addestrati sul layout attuale.
  # Esempio:
  #   pressure:
  #     - {variable: geopotential, level: 500}      # -> z500
  #     - {variable: temperature, level: 850}       # -> t850
  #     - {variable: temperature, level: 500}       # -> t500
  #     - {variable: specific_humidity, level: 700} # -> q700
  pressure: []
  # Campi invarianti nel tempo: scaricati una sola volta.
  static:
    - land_sea_mask
    - geopotential

# Variabili previste, ciascuna con la testa probabilistica che la modella.
# Le altre variabili scaricate restano solo come predittori.
targets:
  - name: t2m
    head: gaussian
  - name: tp
    head: hurdle
    # 0.1 mm in metri: soglia convenzionale sotto la quale non si parla di pioggia.
    threshold: 0.0001
  - name: sf
    head: fraction_of
    reference: tp

features:
  # Ritardi (in slot) usati per costruire i canali di tendenza.
  tendency_lags: [1, 3, 9]
  include_wind_speed: true
  include_time_encoding: true
  include_static: true
  include_latitude_encoding: true

windows:
  # 7 giorni di storico -> 21 slot di input.
  input_slots: 21
  # 3 giorni di previsione -> 9 slot di output.
  output_slots: 9

split:
  # Validazione a finestra mobile. Uno split unico in tre blocchi contigui
  # concentrerebbe il test nella coda del periodo, che qui e estiva: la neve non
  # sarebbe valutabile e la temperatura verrebbe misurata su un solo regime.
  # Con i fold l'origine avanza nel tempo e i blocchi di test coprono tutte le
  # stagioni, mantenendo in ogni fold l'ordine train -> val -> test.
  mode: rolling
  # Storia minima prima del primo fold: circa 11 mesi, cosi il modello vede
  # almeno un ciclo annuale completo prima di essere valutato.
  initial_train_days: 330
  val_days: 60
  test_days: 90
  # Passo pari alla lunghezza del test: i blocchi si susseguono senza buchi
  # ne sovrapposizioni.
  step_days: 90
  # Il train cresce a ogni fold e usa tutta la storia disponibile.
  expanding: true
  # null = tutti i fold che entrano nel periodo.
  n_folds: null
  # Slot scartati alle giunzioni per attenuare l'autocorrelazione.
  gap_slots: 30
  # Usati solo con mode: chronological.
  train_fraction: 0.7
  val_fraction: 0.15

model:
  base_channels: 48
  depth: 3
  blocks_per_level: 2
  dropout: 0.0
  # Blocco elementare della rete: conv | attention | fourier | recurrent | hybrid.
  # Le cinque varianti sono confrontate in VARIANTS.md a parita' assoluta di protocollo.
  # La differenza fra loro (0,024 degC) e' risultata piu' piccola del rumore fra semi
  # (0,059 degC), quindi si sceglie la piu' economica, non la prima in classifica.
  variant: conv
  # La rete prevede lo scarto rispetto all'osservazione piu' recente alla stessa ora del
  # bersaglio, non il valore assoluto. E' l'unica scelta che nel banco esce dal rumore:
  # 6,613 degC senza, 3,625 con.
  anchor_diurnal: true
  # Lo stesso riferimento, dato anche alla probabilita' di pioggia. Il meccanismo resta
  # disponibile ma **spento**, ed e' il caso piu' istruttivo del progetto.
  # A scala ridotta sembrava una vittoria netta: Brier 0,2433 a ampiezza 0 contro 0,1907
  # a 1,1, dispersione fra semi 0,0032, massimo interno nella curva, cioe' tutti i segni
  # di un effetto vero (docs/OCCURRENCE_ANCHOR.md). A piena scala si e' rovesciato:
  # Brier di test 0,181 senza contro 0,192 con, peggio in otto scadenze su nove.
  # La spiegazione e' che l'ancoraggio e' una conoscenza a priori, e una conoscenza a
  # priori vale tanto di piu' quanto meno il modello ha imparato da solo. Un banco da
  # tre epoche misura chi impara in fretta, quindi premia per costruzione i termini a
  # priori: era lo strumento sbagliato per questa domanda. Riaccenderlo richiede una
  # misura a piena scala, non un'altra a scala ridotta.
  occurrence_anchor_logit: 0.0

training:
  seed: 1234
  epochs: 20
  # Un lotto e' una finestra intera: 245 canali x 261 x 401 sono 103 MB di solo ingresso,
  # e la finestra porta con se' undici volte i punti di un ritaglio 96x96.
  batch_size: 1
  # `null` significa **finestra intera**, cioe' il dominio 261x401 come in previsione.
  # Il ritaglio 96x96 addestrava il modello dentro un orizzonte artificiale: una struttura
  # sinottica percorre 500-1000 km al giorno, ma oltre il bordo del ritaglio non c'era
  # nulla da guardare, quindi la rete non poteva imparare a usare informazione che in
  # previsione le viene invece data. Costo misurato per passo, rete globale, con un
  # addestramento concorrente in corso: 800 ms con quattro ritagli 96, 3000 ms sul dominio
  # intero, cioe' 21,7 contro 28,7 secondi per milione di punti previsti. Il dominio
  # intero e' quindi circa un terzo meno efficiente per punto (l'attenzione cresce col
  # quadrato dei token), e si paga volentieri perche' elimina un difetto di
  # addestramento, non un dettaglio di prestazione.
  # Sulla U-Net lo stesso passo costa 10.499 ms: un'altra ragione per cui il nucleo
  # globale e' l'architettura di riferimento.
  crop_size: null
  samples_per_epoch: 512
  # Quante finestre temporali distinte compongono un lotto. Con 1 il gradiente di ogni
  # passo descrive un solo giorno, e le peculiarita' di quel giorno pesano come se
  # fossero regola; alzarlo costa una lettura in piu' per finestra aggiunta, perche' la
  # cache del lettore e' dimensionata sul gruppo.
  windows_per_batch: 1
  learning_rate: 0.0003
  # Andamento del passo di apprendimento: `constant` o `cosine` (riscaldamento poi
  # decadimento a coseno fino al 5% del passo pieno). Il valore predefinito resta
  # costante perche' su questo progetto non e' ancora stato misurato: conta in
  # proporzione al numero di passi, quindi era trascurabile con 2560 passi e va provato
  # sulle corse lunghe.
  lr_schedule: constant
  warmup_fraction: 0.05
  weight_decay: 0.00001
  grad_clip_norm: 1.0
  num_workers: 0
  # Peso relativo dei termini di loss.
  loss_weights:
    gaussian: 1.0
    precip_occurrence: 0.5
    precip_amount: 1.0
    snow_fraction: 0.5
    # Termine spettrale, spento per ora: il suo effetto va misurato sul dominio intero
    # prima di darlo per buono. Scritto qui e non lasciato al default perche' un peso
    # che non compare nella configurazione e' un peso che nessuno ha scelto.
    spectral: 0.0

paths:
  # Volutamente diversa dalla cartella `Data/` gia' presente nel repo: su Windows
  # `data` verrebbe risolto in `Data` (filesystem non case-sensitive) mescolando
  # decine di GB generati ai file tracciati, mentre su Linux e in Docker resterebbe
  # una cartella distinta. Un nome senza collisioni rende il layout identico ovunque.
  data_root: datasets
  raw_subdir: raw
  zarr_name: era5_slots.zarr
  static_name: era5_static.zarr
  tables_subdir: tables
  artifacts_subdir: artifacts

download:
  max_retries: 3
  retry_backoff_seconds: 30
