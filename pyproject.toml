[project]
name = "deep-weather-forecasting"
version = "0.1.0"
description = "Previsione meteo a 3 giorni su griglia euro-atlantica da rianalisi ERA5, con modello convoluzionale probabilistico allenato da zero."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }

dependencies = [
    # La documentazione CDS raccomanda esplicitamente >=0.7.7.
    "cdsapi>=0.7.7",
    "cfgrib>=0.9.14",
    "eccodes>=2.38",
    "xarray>=2025.1.0",
    "zarr>=3.0",
    "dask>=2024.12.0",
    "numpy>=2.1,<3",
    "pandas>=2.2",
    "polars>=1.17",
    "scipy>=1.14",
    "torch>=2.6",
    "matplotlib>=3.9",
    "pyyaml>=6.0",
    "pydantic>=2.9",
    "tqdm>=4.67",
]

[project.optional-dependencies]
notebooks = [
    "jupyterlab>=4.3",
    "ipywidgets>=8.1",
    "ipykernel>=6.29",
]

[project.scripts]
dwf = "dwf.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dwf"]

# I wheel PyPI di torch per Linux includono i binari CUDA (~2.5 GB): inutili qui
# e fatali per la dimensione dell'immagine Docker, quindi si forza l'indice CPU.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
